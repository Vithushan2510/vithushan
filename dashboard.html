<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - My App</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <div class="app-container">

        <!-- ===================== SIDEBAR ===================== -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-icon">S</div>
                <div>
                    <h1 class="brand-title">My App</h1>
                    <span class="brand-subtitle">Skeleton</span>
                </div>
            </div>

            <nav class="nav-menu">
                <!-- Active link gets class "active" -->
                <a href="dashboard.html" class="nav-link active">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z"/>
                    </svg>
                    Dashboard
                </a>

                <a href="items.html" class="nav-link">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                    Items
                </a>
                
                <a href="items.html" class="nav-link">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                    Student
                </a>

                <!-- Add more nav links here for each module -->
            </nav>

            <div class="sidebar-footer" style="display: flex; flex-direction: column; gap: 12px;">
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    App Running
                </div>
                <a href="login.html"
                   class="btn btn-secondary"
                   style="width: 100%; padding: 8px 12px; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-sizing: border-box;">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                    Logout
                </a>
            </div>
        </aside>
        <!-- ==================== END SIDEBAR ==================== -->

        <!-- ===================== MAIN CONTENT ===================== -->
        <main class="main-content">

            <!-- Header Bar -->
            <header class="header">
                <div class="breadcrumb">
                    <span class="breadcrumb-label">System</span>
                    <span class="breadcrumb-separator">/</span>
                    <span class="breadcrumb-active">Dashboard</span>
                </div>
                <div>
                    <!-- Replace "John Doe" with logged-in user's name from session -->
                    <span class="header-badge">John Doe</span>
                </div>
            </header>

            <div class="content-body">

                <!-- Page Title -->
                <div class="dashboard-title-section">
                    <h2 class="page-title">Welcome to the Dashboard</h2>
                    <p class="page-subtitle">Here is a quick overview of your application's data.</p>
                </div>

                <!-- Stat Cards -->
                <!-- Replace hardcoded numbers with SQL COUNT(*) queries -->
                <div class="stats-grid">

                    <div class="stat-card">
                        <div>
                            <span class="stat-label">Total Items</span>
                            <h3 class="stat-value">24</h3>
                            <a href="items.html" class="stat-link">Manage Items &rarr;</a>
                        </div>
                        <div class="stat-icon icon-indigo">
                            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                            </svg>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div>
                            <span class="stat-label">Total Users</span>
                            <h3 class="stat-value">8</h3>
                            <a href="#" class="stat-link">Manage Users &rarr;</a>
                        </div>
                        <div class="stat-icon icon-emerald">
                            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                            </svg>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div>
                            <span class="stat-label">Total Orders</span>
                            <h3 class="stat-value">136</h3>
                            <a href="#" class="stat-link">View Orders &rarr;</a>
                        </div>
                        <div class="stat-icon icon-rose">
                            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                            </svg>
                        </div>
                    </div>

                </div>
                <!-- End Stat Cards -->

            </div>
        </main>
        <!-- ==================== END MAIN CONTENT ==================== -->

    </div>

</body>
</html>
